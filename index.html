<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Taste Tea</title>
  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background-color: #fffaf0;
      color: #4b2e1e;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    header {
      background-color: #f9a825;
      padding: 20px;
    }
    header img {
      height: 80px;
    }
    h1 {
      margin-top: 10px;
    }
    .gallery {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
      margin: 20px;
    }
    .gallery img {
      width: 200px;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    .order-section {
      background-color: #fff3e0;
      padding: 20px;
      margin: 30px auto;
      border-radius: 12px;
      width: 320px;
    }
    label {
      display: block;
      margin: 10px 0 5px;
    }
    select, button {
      padding: 10px;
      width: 100%;
      margin-bottom: 15px;
      font-size: 16px;
    }
    button {
      background-color: #e65100;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #bf360c;
    }
    .price {
      font-size: 20px;
      font-weight: bold;
      margin: 10px 0;
      color: #d84315;
    }
  </style>
</head>

<header>

  <h1>Taste Tea</h1>

</header>
