<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>ร้านชาไทยปารัช</title>
  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background-color: #fffaf0;
      color: #4b2e1e;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    header {
      background-color: #f9a825;
      padding: 20px;
    }
    header img {
      height: 80px;
    }
    h1 {
      margin-top: 10px;
    }
    .gallery {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
      margin: 20px;
    }
    .gallery img {
      width: 200px;
      height: auto;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    .order-section {
      background-color: #fff3e0;
      padding: 20px;
      margin: 30px auto;
      border-radius: 12px;
      width: 300px;
    }
    label {
      display: block;
      margin: 10px 0 5px;
    }
    select, button {
      padding: 10px;
      width: 100%;
      margin-bottom: 15px;
      font-size: 16px;
    }
    button {
      background-color: #e65100;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #bf360c;
    }
  </style>
</head>
<body>

<header>
  <img src="logo.png" alt="โลโก้ร้าน">
  <h1>ร้านชาไทยปารัช</h1>
  <p>หอม หวาน มัน...ถึงใจ</p>
</header>

<section class="gallery">
  <img src="thai_tea1.jpg" alt="ชาไทย 1">
  <img src="thai_tea2.jpg" alt="ชาไทย 2">
  <img src="thai_tea3.jpg" alt="ชาไทย 3">
</section>

<section class="order-section">
  <h2>สั่งชาไทยของคุณ</h2>
  <form>
    <label for="topping">เพิ่มท็อปปิ้ง:</label>
    <select id="topping" name="topping">
      <option value="none">ไม่ใส่</option>
      <option value="cheese">ครีมชีส</option>
      <option value="whip">วิปครีม</option>
    </select>

    <label for="sweetness">ระดับความหวาน:</label>
    <select id="sweetness" name="sweetness">
      <option value="no_sugar">ไม่หวาน</option>
      <option value="less_sugar">หวานน้อย</option>
      <option value="normal_sugar">ปกติ</option>
      <option value="extra_sugar">หวานมาก</option>
    </select>

    <button type="submit">สั่งเลย</button>
  </form>
</section>

</body>
</html>
